<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>蔵書カタログ</title>
  <meta name="description" content="書名・著者・ISBNから蔵書を検索し、貸出依頼を送信できます。">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta property="og:title" content="蔵書カタログ">
  <meta property="og:description" content="公開蔵書検索・貸出依頼">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="蔵書カタログ">
  <meta name="twitter:description" content="公開蔵書検索・貸出依頼">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='12' height='22' rx='2' fill='%231a3a6b'/%3E%3Crect x='17' y='5' width='12' height='22' rx='2' fill='%232563a8'/%3E%3Cpath d='M7 10h5M7 15h5M21 10h5M21 15h5' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{overflow-x:hidden}
    body{font-family:"Hiragino Sans","Meiryo","Noto Sans JP",sans-serif;background:#f4f6fa;color:#1a1a2e;min-height:100vh;overflow-x:hidden}
    .catalog-root{min-height:100vh;display:flex;flex-direction:column}
    .catalog-header{background:linear-gradient(135deg,#1a3a6b 0%,#2563a8 100%);color:white;padding:28px 40px 24px;box-shadow:0 2px 12px #0003}
    .catalog-header h1{font-size:1.7rem;font-weight:700;letter-spacing:.02em}
    .catalog-subtitle{font-size:.9rem;opacity:.82;margin-top:4px}
    .catalog-main{flex:1;padding:28px 32px;max-width:1200px;margin:0 auto;width:100%}
    .filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}
    .filter-input{flex:1;min-width:200px;padding:9px 14px;border:1.5px solid #c8d4e8;border-radius:8px;font-size:.95rem;background:white;outline:none;transition:border-color .2s}
    .filter-input:focus,.filter-select:focus{border-color:#2563a8;box-shadow:0 0 0 3px #2563a81f}
    .filter-select{padding:9px 12px;border:1.5px solid #c8d4e8;border-radius:8px;font-size:.9rem;background:white;outline:none;cursor:pointer;transition:border-color .2s}
    .genre-filter-control{position:relative;flex:0 1 260px;min-width:190px}
    .genre-filter-trigger{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left}
    .genre-filter-chevron{color:#6b7280;transition:transform .15s}
    .genre-filter-control.is-open .genre-filter-chevron{transform:rotate(180deg)}
    .genre-filter-source{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
    .genre-filter-menu{position:absolute;z-index:50;top:calc(100% + 6px);left:0;right:0;max-height:320px;overflow:auto;padding:6px;background:#fff;border:1px solid #c8d4e8;border-radius:8px;box-shadow:0 8px 24px #0002}
    .genre-filter-tree,.genre-filter-tree ul{list-style:none;margin:0;padding:0}
    .genre-filter-tree ul{margin-left:14px;padding-left:10px;border-left:1px solid #d8e0eb}
    .genre-filter-tree > li > ul{display:none}
    .genre-filter-tree > li.is-expanded > ul{display:block}
    .genre-filter-option{display:flex;width:100%;padding:7px 8px;border:0;border-radius:5px;background:transparent;color:#1a1a2e;font:inherit;text-align:left;cursor:pointer}
    .genre-filter-option:hover,.genre-filter-option:focus-visible{outline:none;background:#eef3fb}
    .genre-filter-parent{font-weight:700}
    .genre-filter-parent.has-children::after{content:"▾";margin-left:auto;color:#6b7280;font-size:.75rem}
    .genre-filter-parent.has-children[aria-expanded="true"]::after{content:"▴"}
    .genre-filter-child{color:#4b5563}
    .genre-filter-option.is-active{background:#dbeafe;color:#1a3a6b}
    .btn-request{padding:9px 20px;background:#2563a8;color:white;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .2s,transform .1s;white-space:nowrap}
    .btn-request:hover{background:#1a4f8a;transform:translateY(-1px)}
    .alert{padding:12px 18px;border-radius:8px;margin-bottom:16px;font-size:.95rem;line-height:1.5}
    .alert-ok{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
    .alert-err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
    .loading{text-align:center;padding:60px;color:#6b7280;font-size:1rem}
    .table-wrap{background:white;border-radius:12px;box-shadow:0 2px 12px #00000012;overflow-x:auto;overflow-y:visible}
    .book-table{width:100%;min-width:700px;border-collapse:collapse;font-size:.9rem}
    .book-table thead{background:#1a3a6b;color:white}
    .book-table thead tr th:first-child{border-top-left-radius:12px}
    .book-table thead tr th:last-child{border-top-right-radius:12px}
    .book-table th{padding:12px 14px;text-align:left;font-weight:600;font-size:.85rem;letter-spacing:.03em;white-space:nowrap}
    .book-table tbody tr{border-bottom:1px solid #e8edf5;cursor:pointer;transition:background .15s}
    .book-table tbody tr:hover{background:#eef3fb}
    .book-table tbody tr.row-selected{background:#dbeafe}
    .book-table tbody tr.row-selected:hover{background:#bfdbfe}
    .book-table td{padding:10px 14px;vertical-align:top}
    .genre-cell{padding:0!important;min-width:150px}
    .genre-cell-content{display:flex;flex-direction:column;min-width:0}
    .genre-main,.genre-sub{display:block;box-sizing:border-box;min-height:2.25rem;padding:8px 14px;overflow:hidden;white-space:nowrap;text-overflow:clip}
    .genre-sub{border-top:1px solid #e8edf5;background:#f9fafc;color:#6b7280;font-size:.82rem}
    .sort-button{display:inline-flex;align-items:center;gap:5px;padding:0;border:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;cursor:pointer}
    .sort-button:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:2px}
    .sort-indicator{font-size:.75rem;opacity:.72}
    .col-check{width:40px;text-align:center}
    .col-check input{width:16px;height:16px;cursor:pointer;accent-color:#2563a8}
    .col-title{max-width:300px}
    .book-title{display:block;font-weight:600;color:#1a1a2e}
    .book-sub-attributes{display:block;margin-top:2px;color:#6b7280;font-size:.76rem}
    .book-isbn{display:block;font-size:.78rem;color:#9ca3af;margin-top:2px}
    td.empty{text-align:center;color:#9ca3af;padding:48px;font-size:.95rem}
    .table-footer{padding:10px 16px;font-size:.82rem;color:#6b7280;border-top:1px solid #e8edf5;background:#f9fafc}
    .modal-backdrop{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
    .modal{background:white;border-radius:14px;padding:32px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px #0005}
    .modal h2{font-size:1.2rem;font-weight:700;margin-bottom:18px;color:#1a3a6b}
    .modal-label{font-size:.82rem;color:#6b7280;font-weight:600;margin-bottom:8px}
    .modal-books{background:#f4f6fa;border-radius:8px;padding:14px 16px;margin-bottom:20px}
    .modal-books ul{list-style:none}
    .modal-books li{font-size:.9rem;padding:4px 0;border-bottom:1px solid #e8edf5;color:#374151}
    .modal-books li:last-child{border-bottom:none}
    .form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
    .form-row label{font-size:.85rem;font-weight:600;color:#374151}
    .form-row input,.form-row textarea{padding:9px 12px;border:1.5px solid #c8d4e8;border-radius:8px;font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s;resize:vertical}
    .form-row input:focus,.form-row textarea:focus{border-color:#2563a8;box-shadow:0 0 0 3px #2563a81f}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
    .btn-cancel,.btn-submit{padding:9px 20px;border-radius:8px;font-size:.9rem;cursor:pointer}
    .btn-cancel{background:#f3f4f6;color:#374151;border:1.5px solid #d1d5db}
    .btn-submit{padding-inline:22px;background:#2563a8;color:white;border:none;font-weight:600}
    .btn-submit:hover:not(:disabled){background:#1a4f8a}
    .btn-submit:disabled{opacity:.6;cursor:not-allowed}
    [hidden]{display:none!important}
    @media(max-width:700px){
      .catalog-header{padding:20px 16px 18px}.catalog-header h1{font-size:1.4rem}
      .catalog-main{padding:16px 12px}.filter-bar{gap:8px}
      .filter-input{flex:1 1 100%;width:100%;min-width:0}
      .genre-filter-control{flex:1 1 calc(50% - 4px);min-width:0}
      .btn-request{flex:1 1 100%;width:100%}
      .book-table{min-width:680px}.book-table th,.book-table td{padding-inline:10px}
      .modal-backdrop{align-items:flex-end;padding:0}
      .modal{border-radius:14px 14px 0 0;padding:24px;max-height:92vh}
      .modal-actions{flex-direction:column-reverse}.btn-cancel,.btn-submit{width:100%}
    }
  </style>
</head>
<body>
  <div class="catalog-root">
    <header class="catalog-header">
      <h1>📚 蔵書カタログ</h1>
      <p class="catalog-subtitle">公開蔵書検索・貸出依頼</p>
    </header>
    <main class="catalog-main">
      <div class="filter-bar">
        <input class="filter-input" id="search-input" type="search" placeholder="書名・著者・ISBNで検索…" aria-label="書名・著者・ISBNで検索">
        <div class="genre-filter-control">
          <button class="filter-select genre-filter-trigger" id="genre-filter-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="genre-filter-menu">
            <span id="genre-filter-label">すべてのジャンル</span><span class="genre-filter-chevron" aria-hidden="true">▾</span>
          </button>
          <div class="genre-filter-menu" id="genre-filter-menu" hidden><ul class="genre-filter-tree" id="genre-filter-tree"></ul></div>
          <select class="genre-filter-source" id="genre-filter" aria-label="ジャンルで絞り込み" aria-hidden="true" tabindex="-1"><option value="">すべてのジャンル</option></select>
        </div>
        <button class="btn-request" id="open-request" type="button" hidden>貸出依頼</button>
      </div>
      <div id="submit-message" aria-live="polite"></div>
      <div class="loading" id="loading">読み込み中…</div>
      <div class="alert alert-err" id="load-error" role="alert" hidden></div>
      <div class="table-wrap" id="table-wrap" hidden>
        <table class="book-table">
          <thead><tr>
            <th class="col-check"><input type="checkbox" id="select-visible" title="すべて選択" aria-label="表示中の書籍をすべて選択"></th>
            <th>書名</th><th>著者</th><th>出版社</th><th id="genre-sort-header" aria-sort="none"><button class="sort-button" id="genre-sort" type="button" aria-label="ジャンルで並べ替え">ジャンル <span class="sort-indicator">↕</span></button></th><th>在庫</th>
          </tr></thead>
          <tbody id="book-rows"></tbody>
        </table>
        <div class="table-footer" id="table-footer"></div>
      </div>
    </main>
  </div>
  <div class="modal-backdrop" id="request-dialog" role="presentation" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="request-title">
      <h2 id="request-title">📋 貸出依頼</h2>
      <div class="modal-books">
        <p class="modal-label" id="request-count"></p>
        <ul id="request-books"></ul>
      </div>
      <form id="request-form">
        <div class="form-row">
          <label for="request-name">お名前</label>
          <input id="request-name" type="text" placeholder="（任意）">
        </div>
        <div class="form-row">
          <label for="request-contact">連絡先</label>
          <input id="request-contact" type="text" placeholder="メール・電話など（任意）">
        </div>
        <div class="form-row">
          <label for="request-message">メッセージ</label>
          <textarea id="request-message" rows="3" placeholder="（任意）"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancel-request">キャンセル</button>
          <button type="submit" class="btn-submit" id="submit-request">依頼を送信</button>
        </div>
      </form>
    </section>
  </div>
  <script>
    "use strict";
    const SUPABASE_URL = "https://dzfvxpykmqknfvsgmkgn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_HMcMM7G36QhFJKjWBFg5qw_YM9nXNWj";
    const DEFAULT_GENRES = ["ワイドコミック", "文庫コミック"];
    let books = [];
    let attributes = [];
    let selected = new Set();
    let submitting = false;
    let genreSortDirection = 0;
    const $ = (selector) => document.querySelector(selector);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    async function api(path, { method = "GET", body } = {}) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        method,
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          ...(body === undefined ? {} : { "Content-Type": "application/json" })
        },
        ...(body === undefined ? {} : { body: JSON.stringify(body) })
      });
      const text = await response.text();
      if (!response.ok) throw new Error(text || `HTTP ${response.status}`);
      return text ? JSON.parse(text) : null;
    }

    function getVisibleBooks() {
      const query = $("#search-input").value.trim().toLowerCase();
      const genre = $("#genre-filter").value;
      const visible = books.filter((book) => {
        if (query && !`${book.title} ${book.author || ""} ${book.isbn || ""}`.toLowerCase().includes(query)) return false;
        if (genre.startsWith("main:") && Number(book.mainAttributeId) !== Number(genre.slice(5))) return false;
        if (genre.startsWith("main-name:") && book.genre !== genre.slice(10)) return false;
        if (genre.startsWith("sub:") && !(book.subAttributeIds || []).includes(Number(genre.slice(4)))) return false;
        return true;
      });
      if (genreSortDirection) {
        visible.sort((a, b) => {
          const aGenre = `${a.genre || ""}\u0000${(a.subAttributes || []).join(" ")}`.toLowerCase();
          const bGenre = `${b.genre || ""}\u0000${(b.subAttributes || []).join(" ")}`.toLowerCase();
          return aGenre < bGenre ? -genreSortDirection : aGenre > bGenre ? genreSortDirection : 0;
        });
      }
      return visible;
    }

    function render() {
      const visible = getVisibleBooks();
      const tbody = $("#book-rows");
      if (!visible.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">該当する書籍がありません。</td></tr>';
      } else {
        tbody.innerHTML = visible.map((book) => `
          <tr data-id="${book.id}" class="${selected.has(book.id) ? "row-selected" : ""}">
            <td class="col-check"><input type="checkbox" ${selected.has(book.id) ? "checked" : ""} aria-label="${escapeHtml(book.title)}を選択"></td>
            <td class="col-title"><span class="book-title">${escapeHtml(book.title)}</span>${book.isbn ? `<span class="book-isbn">ISBN: ${escapeHtml(book.isbn)}</span>` : ""}</td>
            <td>${escapeHtml(book.author || "—")}</td>
            <td>${escapeHtml(book.publisher || "—")}</td>
            <td class="genre-cell"><div class="genre-cell-content"><div class="genre-main">${escapeHtml(book.genre || "—")}</div><div class="genre-sub">${escapeHtml(book.subAttributes.length ? book.subAttributes.join("、") : "—")}</div></div></td>
            <td class="col-stock">${Number(book.stock) || 0}</td>
          </tr>`).join("");
      }
      const allSelected = visible.length > 0 && visible.every((book) => selected.has(book.id));
      $("#select-visible").checked = allSelected;
      $("#open-request").hidden = selected.size === 0;
      $("#open-request").textContent = `貸出依頼 (${selected.size}冊)`;
      $("#table-footer").textContent = `${visible.length}件表示 / 全${books.length}件${selected.size ? `　${selected.size}件選択中` : ""}`;
    }

    function renderGenres() {
      const mainAttributes = attributes.filter((attribute) => attribute.attribute_type === "main");
      const knownNames = new Set(mainAttributes.map((attribute) => attribute.name));
      const fallbackGenres = [...new Set([...DEFAULT_GENRES, ...books.map((book) => book.genre).filter(Boolean)])]
        .filter((genre) => !knownNames.has(genre))
        .sort((a, b) => a.localeCompare(b, "ja"));
      const select = $("#genre-filter");
      const selected = select.value;
      const tree = $("#genre-filter-tree");
      select.innerHTML = "";
      tree.innerHTML = "";

      const appendItem = (parent, label, value, className = "") => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        select.appendChild(option);

        const item = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.className = `genre-filter-option ${className}`.trim();
        button.dataset.value = value;
        button.textContent = label;
        item.appendChild(button);
        parent.appendChild(item);
        return item;
      };

      appendItem(tree, "すべてのジャンル", "");
      mainAttributes.forEach((main) => {
        const children = attributes
          .filter((attribute) => attribute.attribute_type === "sub" && !attribute.is_r18 && Number(attribute.parent_attribute_id) === Number(main.id))
          .sort((a, b) => a.name.localeCompare(b.name, "ja"));
        const mainItem = appendItem(tree, main.name, `main:${main.id}`, `genre-filter-parent${children.length ? " has-children" : ""}`);
        if (children.length) {
          mainItem.querySelector(":scope > .genre-filter-option").setAttribute("aria-expanded", "false");
          const childList = document.createElement("ul");
          children.forEach((child) => appendItem(childList, child.name, `sub:${child.id}`, "genre-filter-child"));
          mainItem.appendChild(childList);
        }
      });
      fallbackGenres.forEach((genre) =>
        appendItem(tree, genre, `main-name:${genre}`, "genre-filter-parent"),
      );

      select.value = Array.from(select.options).some((option) => option.value === selected) ? selected : "";
      $("#genre-filter-label").textContent = select.selectedOptions[0]?.textContent || "すべてのジャンル";
      tree.querySelectorAll(".genre-filter-option").forEach((button) =>
        button.classList.toggle("is-active", button.dataset.value === select.value),
      );
    }

    async function loadBooks() {
      const params = new URLSearchParams({
        select: "id,isbn,title,author,publisher,genre,stock,main_attribute_id",
        is_purchase_planned: "eq.false",
        is_provisional: "eq.false",
        rental: "eq.○",
        stock: "gt.0",
        order: "title.asc"
      });
      try {
        const [rows, attributeRows, assignments] = await Promise.all([
          api(`books?${params.toString()}`),
          api("attributes?select=id%2Cname%2Cattribute_type%2Cis_r18%2Cparent_attribute_id"),
          api("book_attributes?select=book_id%2Cattribute_id")
        ]);
        attributes = attributeRows || [];
        const attributeById = new Map(attributes.map((attribute) => [Number(attribute.id), attribute]));
        const restrictedIds = new Set(
          (assignments || [])
            .filter((assignment) => attributeById.get(Number(assignment.attribute_id))?.is_r18)
            .map((assignment) => Number(assignment.book_id))
        );
        books = (rows || [])
          .filter((book) => !restrictedIds.has(Number(book.id)))
          .map((book) => ({
            ...book,
            mainAttributeId: Number(book.main_attribute_id) || Number(attributes.find((attribute) => attribute.attribute_type === "main" && attribute.name === book.genre)?.id) || null,
            genre: attributeById.get(Number(book.main_attribute_id))?.name || book.genre,
            subAttributeIds: (assignments || [])
              .filter((assignment) => Number(assignment.book_id) === Number(book.id))
              .map((assignment) => attributeById.get(Number(assignment.attribute_id)))
              .filter((attribute) => attribute && attribute.attribute_type === "sub" && !attribute.is_r18 && Number(attribute.parent_attribute_id) === Number(book.main_attribute_id || attributes.find((main) => main.attribute_type === "main" && main.name === book.genre)?.id))
              .map((attribute) => Number(attribute.id)),
            subAttributes: (assignments || [])
              .filter((assignment) => Number(assignment.book_id) === Number(book.id))
              .map((assignment) => attributeById.get(Number(assignment.attribute_id)))
              .filter((attribute) => attribute && attribute.attribute_type === "sub" && !attribute.is_r18 && Number(attribute.parent_attribute_id) === Number(book.main_attribute_id || attributes.find((main) => main.attribute_type === "main" && main.name === book.genre)?.id))
              .map((attribute) => attribute.name)
          }));
        const availableIds = new Set(books.map((book) => book.id));
        selected = new Set([...selected].filter((id) => availableIds.has(id)));
        renderGenres();
        $("#table-wrap").hidden = false;
        render();
      } catch (error) {
        $("#load-error").textContent = `書籍データの取得に失敗しました: ${error.message}`;
        $("#load-error").hidden = false;
      } finally {
        $("#loading").hidden = true;
      }
    }

    function openRequestDialog() {
      const selectedBooks = books.filter((book) => selected.has(book.id));
      if (!selectedBooks.length) return;
      $("#request-count").textContent = `依頼対象の書籍 (${selectedBooks.length}冊)`;
      $("#request-books").innerHTML = selectedBooks.map((book) =>
        `<li>${escapeHtml(book.title)}${book.author ? ` / ${escapeHtml(book.author)}` : ""}</li>`
      ).join("");
      $("#request-dialog").hidden = false;
    }

    async function submitRequest(event) {
      event.preventDefault();
      if (submitting) return;
      const selectedBooks = books.filter((book) => selected.has(book.id));
      if (!selectedBooks.length) return;
      submitting = true;
      const button = $("#submit-request");
      button.disabled = true;
      button.textContent = "送信中…";
      $("#submit-message").innerHTML = "";
      const payload = selectedBooks.map((book) => ({
        book_id: book.id,
        requester_name: $("#request-name").value.trim() || null,
        requester_contact: $("#request-contact").value.trim() || null,
        message: $("#request-message").value.trim() || null
      }));
      try {
        await api("loan_requests", { method: "POST", body: payload });
        selected.clear();
        $("#request-dialog").hidden = true;
        $("#request-form").reset();
        $("#submit-message").innerHTML = '<div class="alert alert-ok" role="status">✅ 貸出依頼を送信しました。</div>';
        render();
      } catch (error) {
        console.error("貸出依頼の送信に失敗しました", error);
        $("#submit-message").innerHTML = '<div class="alert alert-err" role="alert">❌ 送信に失敗しました。入力内容と通信状態を確認して、再度お試しください。</div>';
      } finally {
        submitting = false;
        button.disabled = false;
        button.textContent = "依頼を送信";
      }
    }

    $("#search-input").addEventListener("input", render);
    $("#genre-filter").addEventListener("change", render);
    $("#genre-filter-trigger").addEventListener("click", () => {
      const menu = $("#genre-filter-menu");
      const open = menu.hidden;
      menu.hidden = !open;
      $("#genre-filter-trigger").setAttribute("aria-expanded", String(open));
      $("#genre-filter-trigger").closest(".genre-filter-control").classList.toggle("is-open", open);
    });
    $("#genre-filter-tree").addEventListener("click", (event) => {
      const option = event.target.closest(".genre-filter-option");
      if (!option) return;
      const parentItem = option.closest("#genre-filter-tree > li");
      if (option.classList.contains("has-children")) {
        const wasExpanded = parentItem.classList.contains("is-expanded");
        document.querySelectorAll("#genre-filter-tree > li.is-expanded").forEach((item) => {
          item.classList.remove("is-expanded");
          item.querySelector(":scope > .genre-filter-option")?.setAttribute("aria-expanded", "false");
        });
        if (!wasExpanded) {
          parentItem.classList.add("is-expanded");
          option.setAttribute("aria-expanded", "true");
        }
        $("#genre-filter").value = option.dataset.value;
        $("#genre-filter-label").textContent = option.textContent;
        $("#genre-filter-tree").querySelectorAll(".genre-filter-option").forEach((button) =>
          button.classList.toggle("is-active", button === option),
        );
        render();
        return;
      }
      $("#genre-filter").value = option.dataset.value;
      $("#genre-filter-label").textContent = option.textContent;
      $("#genre-filter-tree").querySelectorAll(".genre-filter-option").forEach((button) =>
        button.classList.toggle("is-active", button === option),
      );
      $("#genre-filter-menu").hidden = true;
      $("#genre-filter-trigger").setAttribute("aria-expanded", "false");
      $("#genre-filter-trigger").closest(".genre-filter-control").classList.remove("is-open");
      render();
    });
    document.addEventListener("click", (event) => {
      const control = $(".genre-filter-control");
      if (control && !control.contains(event.target)) {
        $("#genre-filter-menu").hidden = true;
        $("#genre-filter-trigger").setAttribute("aria-expanded", "false");
        control.classList.remove("is-open");
      }
    });
    $("#genre-sort").addEventListener("click", () => {
      genreSortDirection = genreSortDirection === 1 ? -1 : 1;
      const button = $("#genre-sort");
      $("#genre-sort-header").setAttribute("aria-sort", genreSortDirection === 1 ? "ascending" : "descending");
      button.querySelector(".sort-indicator").textContent = genreSortDirection === 1 ? "↑" : "↓";
      render();
    });
    $("#select-visible").addEventListener("change", (event) => {
      getVisibleBooks().forEach((book) => event.target.checked ? selected.add(book.id) : selected.delete(book.id));
      render();
    });
    $("#book-rows").addEventListener("click", (event) => {
      const row = event.target.closest("tr[data-id]");
      if (!row || event.target.matches("input")) return;
      const id = Number(row.dataset.id);
      selected.has(id) ? selected.delete(id) : selected.add(id);
      render();
    });
    $("#book-rows").addEventListener("change", (event) => {
      if (!event.target.matches('input[type="checkbox"]')) return;
      const id = Number(event.target.closest("tr").dataset.id);
      event.target.checked ? selected.add(id) : selected.delete(id);
      render();
    });
    $("#open-request").addEventListener("click", openRequestDialog);
    $("#cancel-request").addEventListener("click", () => { if (!submitting) $("#request-dialog").hidden = true; });
    $("#request-dialog").addEventListener("click", (event) => {
      if (event.target === $("#request-dialog") && !submitting) $("#request-dialog").hidden = true;
    });
    $("#request-form").addEventListener("submit", submitRequest);
    loadBooks();
  </script>
</body>
</html>
